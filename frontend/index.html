<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Asset Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg); color: var(--primary); padding: 2rem; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; font-size: 1.8rem; }
        .search-box { display: flex; gap: 1rem; margin-bottom: 2rem; }
        input { flex: 1; padding: 1rem; font-size: 1.1rem; border: 2px solid var(--border); border-radius: 8px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { padding: 1rem 2rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1e293b; }
        .popular-stocks { margin: -0.5rem 0 2rem; }
        .popular-stocks h2 { margin: 0 0 0.35rem; font-size: 1rem; }
        .popular-stocks p { margin: 0 0 0.85rem; color: #64748b; font-size: 0.9rem; }
        .stock-buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .stock-button { display: flex; align-items: center; gap: 0.45rem; padding: 0.65rem 0.9rem; background: #f8fafc; color: var(--primary); border: 1px solid var(--border); border-radius: 999px; }
        .stock-button:hover, .stock-button[aria-pressed="true"] { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
        .stock-button span { color: #64748b; font-size: 0.8rem; }

        #dashboard { display: none; margin-top: 2rem; }
        .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .price-large { font-size: 3rem; font-weight: 800; line-height: 1; }
        .change { font-size: 1.2rem; font-weight: 600; margin-left: 10px; }
        .up { color: #16a34a; }
        .down { color: #dc2626; }
        .badges { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; background: #e2e8f0; }
        .badge-live { background: #fee2e2; color: #991b1b; }
        .badge-cache { background: #dcfce7; color: #166534; }

        .chart-container { height: 350px; width: 100%; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Advanced Asset Terminal 📈</h1>
        <p style="color: #64748b; margin-bottom: 2rem;">Real-time quotes and 7-day historical trend visualization.</p>

        <div class="search-box">
            <input type="text" id="ticker" placeholder="Search AAPL, 0700.HK, BTC-USD..." value="NVDA">
            <button onclick="fetchData()">Analyze</button>
        </div>

        <section class="popular-stocks" aria-labelledby="popular-stocks-heading">
            <h2 id="popular-stocks-heading">Popular stocks</h2>
            <p>Choose a stock to view its latest quote and 7-day trend.</p>
            <div class="stock-buttons" role="group" aria-label="Popular stocks">
                <button type="button" class="stock-button" data-ticker="AAPL" aria-pressed="false" onclick="selectStock('AAPL')">Apple <span>AAPL</span></button>
                <button type="button" class="stock-button" data-ticker="MSFT" aria-pressed="false" onclick="selectStock('MSFT')">Microsoft <span>MSFT</span></button>
                <button type="button" class="stock-button" data-ticker="NVDA" aria-pressed="false" onclick="selectStock('NVDA')">NVIDIA <span>NVDA</span></button>
                <button type="button" class="stock-button" data-ticker="AMZN" aria-pressed="false" onclick="selectStock('AMZN')">Amazon <span>AMZN</span></button>
                <button type="button" class="stock-button" data-ticker="GOOGL" aria-pressed="false" onclick="selectStock('GOOGL')">Alphabet <span>GOOGL</span></button>
                <button type="button" class="stock-button" data-ticker="META" aria-pressed="false" onclick="selectStock('META')">Meta <span>META</span></button>
                <button type="button" class="stock-button" data-ticker="TSLA" aria-pressed="false" onclick="selectStock('TSLA')">Tesla <span>TSLA</span></button>
                <button type="button" class="stock-button" data-ticker="JPM" aria-pressed="false" onclick="selectStock('JPM')">JPMorgan <span>JPM</span></button>
            </div>
        </section>

        <div id="error-msg" style="color: #dc2626; font-weight: bold;"></div>

        <div id="dashboard">
            <div class="header-row">
                <div>
                    <h2 id="asset-name" style="margin: 0 0 10px 0; color: #64748b;"></h2>
                    <div style="display: flex; align-items: baseline;">
                        <span class="price-large" id="asset-price"></span>
                        <span id="asset-currency" style="margin-left: 8px; color: #64748b; font-weight: bold;"></span>
                        <span class="change" id="asset-change"></span>
                    </div>
                    <div class="badges" id="asset-badges"></div>
                </div>
            </div>

            <h3 style="margin-bottom: 0;">7-Day Price Trend</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let trendChartInstance = null;
        const tickerInput = document.getElementById('ticker');

        function updatePopularStockSelection(ticker) {
            document.querySelectorAll('.stock-button').forEach(button => {
                button.setAttribute('aria-pressed', String(button.dataset.ticker === ticker.toUpperCase()));
            });
        }

        function selectStock(ticker) {
            tickerInput.value = ticker;
            updatePopularStockSelection(ticker);
            fetchData();
        }

        tickerInput.addEventListener('input', () => updatePopularStockSelection(tickerInput.value.trim()));
        updatePopularStockSelection(tickerInput.value.trim());

        async function fetchData() {
            const ticker = tickerInput.value.trim();
            if (!ticker) return;

            document.getElementById('error-msg').innerText = "Loading data...";
            document.getElementById('dashboard').style.display = 'none';

            try {
                const res = await fetch(`/api/quote/${encodeURIComponent(ticker)}`);
                const data = await res.json();

                document.getElementById('error-msg').innerText = "";

                if (data.error) {
                    document.getElementById('error-msg').innerText = data.error;
                    return;
                }

                // Update UI text
                document.getElementById('asset-name').innerText = `${data.name} (${data.ticker})`;
                document.getElementById('asset-price').innerText = data.price.toLocaleString();
                document.getElementById('asset-currency').innerText = data.currency;

                const changeEl = document.getElementById('asset-change');
                const isUp = data.change_pct >= 0;
                changeEl.innerText = (isUp ? "+" : "") + data.change_pct + "%";
                changeEl.className = "change " + (isUp ? "up" : "down");

                // Badges
                const isCached = data.source.includes("Cache");
                document.getElementById('asset-badges').innerHTML = `
                    <span class="badge">${data.market_classification}</span>
                    <span class="badge ${isCached ? 'badge-cache' : 'badge-live'}">${data.source}</span>
                    <span class="badge">${data.market_state === 'REGULAR' ? '🟢 Market Open' : '🔴 Market Closed'}</span>
                `;

                document.getElementById('dashboard').style.display = 'block';

                // Render Chart
                renderChart(data.trend.dates, data.trend.prices, isUp);

            } catch (err) {
                document.getElementById('error-msg').innerText = "Connection error to API.";
            }
        }

        function renderChart(labels, data, isUp) {
            const ctx = document.getElementById('trendChart').getContext('2d');

            if (trendChartInstance) {
                trendChartInstance.destroy();
            }

            const lineColor = isUp ? '#16a34a' : '#dc2626';
            const bgColor = isUp ? 'rgba(22, 163, 74, 0.1)' : 'rgba(220, 38, 38, 0.1)';

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Closing Price',
                        data: data,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            grid: { color: '#e2e8f0' },
                            ticks: {
                                callback: function(value) { return value.toLocaleString(); }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
