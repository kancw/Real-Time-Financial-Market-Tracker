name: Multi-Market Analytics Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Compose Configuration (YAML validation)
        run: docker compose config

      - name: Build Backend Container
        run: docker build -t multi-market-backend:test ./backend

      - name: Build Frontend Container
        run: docker build -t multi-market-frontend:test ./frontend
